name: Update fixture times

# Checks football-data.org for Chelsea's Premier League kickoff times and
# commits any changes straight to main. GitHub Pages rebuilds on its own from
# main, so the fixture card on the site updates with no one in the loop.
#
# SETUP, ONE TIME:
#   1. Get a free key at football-data.org/client/register
#   2. Repo Settings -> Secrets and variables -> Actions -> New repository secret
#      Name: FOOTBALL_DATA_TOKEN
#
# TO TEST: Actions tab -> Update fixture times -> Run workflow.
#
# The script only ever touches `date` and `kickoffET`. Hand-written fields —
# `label`, `note`, `venue`, `opponent`, `home`, `doorsOpen` — are left alone,
# and it refuses to write at all if the API payload looks incomplete.
#
# Cup ties are not covered: the FA Cup and Carabao Cup are outside
# football-data.org's free tier, so those stay manual.

on:
  schedule:
    # 11:00 UTC daily — early morning in Philadelphia, after UK announcements.
    # GitHub runs scheduled jobs on UTC year-round, so this drifts an hour
    # relative to local time across daylight saving. That does not matter here.
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for new kickoff times
        id: update
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python scripts/update_fixtures.py

      - name: Publish to main if anything changed
        run: |
          if [ -z "$(git status --porcelain docs/fixtures.json)" ]; then
            echo "Kickoff times unchanged — nothing to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/fixtures.json
          git commit -m "Update fixture kickoff times from football-data.org"
          git push || {
            echo "Push rejected — main moved. Rebasing and retrying."
            git pull --rebase origin main
            git push
          }
          echo "Published new kickoff times to main."
