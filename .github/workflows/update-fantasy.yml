name: Update fantasy standings

# Pulls the Philly Blues mini-league standings from the public Fantasy
# Premier League API and commits them straight to main. GitHub Pages rebuilds
# on its own from main, so the table on the site updates with no one in the
# loop. Nothing to review, nothing to merge.
#
# SETUP: none. The FPL standings API is public, so there is no token to add.
# The job only needs "contents: write", granted below.
#
# TO TEST: Actions tab -> Update fantasy standings -> Run workflow.
#
# CADENCE: Tuesday mornings. Gameweeks usually finish Sunday/Monday, so a
# Tuesday run picks up settled points. Harmless to run more often — it only
# commits when the standings actually changed.

on:
  schedule:
    # 12:00 UTC every Tuesday — early morning in Philadelphia.
    - cron: "0 12 * * 2"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull the latest standings
        run: python scripts/update_fantasy.py

      - name: Publish to main if anything changed
        run: |
          if [ -z "$(git status --porcelain docs/fantasy.json)" ]; then
            echo "Standings unchanged — nothing to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/fantasy.json
          git commit -m "Update fantasy standings from the FPL API"
          git push || {
            echo "Push rejected — main moved. Rebasing and retrying."
            git pull --rebase origin main
            git push
          }
          echo "Published new standings to main."
